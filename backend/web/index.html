<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Priton Admin</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #07131b; color: #f5f7fb; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px; }
      .card { background: #111f2d; border: 1px solid #26425c; border-radius: 16px; padding: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
      h1 { margin-top: 0; }
      code { background: #0a1723; padding: 2px 6px; border-radius: 6px; }
      ul { line-height: 1.7; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Priton Core</h1>
        <p>Self-hosted VPN / proxy platform scaffold ready for Ubuntu deployment.</p>
        <ul>
          <li>Admin API: <code>/api/v1/auth/login</code></li>
          <li>Android client endpoint: <code>/api/v1/client/auth</code></li>
          <li>Health check: <code>/health</code></li>
          <li>Docker deployment: <code>./install.sh</code></li>
        </ul>
      </div>
    </div>
  </body>
</html>
