services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: priton-api
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me}
      API_KEY: ${API_KEY:-change-me}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: priton
      DB_PASS: ${DB_PASS:-priton-pass}
      DB_NAME: priton
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: priton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: priton
      POSTGRES_PASSWORD: ${DB_PASS:-priton-pass}
      POSTGRES_DB: priton
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priton -d priton"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: priton-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: priton-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${HTTP_PORT:-30385}:80"
      - "${HTTPS_PORT:-30386}:443"
    depends_on:
      api:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: priton-bot
    restart: unless-stopped
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-changeme}
      API_BASE_URL: http://api:8080

volumes:
  pgdata:
