services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: priton-api
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me}
      API_KEY: ${API_KEY:-change-me}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: priton
      DB_PASS: ${DB_PASS:-priton-pass}
      DB_NAME: priton
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
      - "30385:80"
      - "30386:443"
      - "30388-30437:30388-30437"

  postgres:
    image: postgres:16-alpine
    container_name: priton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: priton
      POSTGRES_PASSWORD: ${DB_PASS:-priton-pass}
      POSTGRES_DB: priton
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: priton-redis
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: priton-caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "30385:80"
      - "30386:443"
    depends_on:
      - api

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: priton-bot
    restart: unless-stopped
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-changeme}
      API_BASE_URL: http://api:8080

volumes:
  pgdata:
